<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>cast probe</title></head>
<body style="font: 12px monospace; background: #111; color: #9f9">
<div id="out">connecting…</div>
<canvas id="cv"></canvas>
<script>
const out = document.getElementById("out");
const log = (m) => { out.textContent += "\n" + m; };
const stats = {};
function probe(name, path) {
  const s = stats[name] = { msgs: 0, bytes: 0, nal: {}, configured: null, decodeOk: 0, decodeErr: 0, out: 0, err: "" };
  const ws = new WebSocket(`ws://${location.host}${path}`);
  ws.binaryType = "arraybuffer";
  let buf = new Uint8Array(0);
  let dec = null;
  const cv = document.getElementById("cv");
  ws.onopen = () => log(`[${name}] open`);
  ws.onerror = (e) => { s.err = "ws error"; };
  ws.onclose = () => log(`[${name}] close`);
  ws.onmessage = (ev) => {
    const inc = new Uint8Array(ev.data);
    s.msgs++; s.bytes += inc.length;
    const m = new Uint8Array(buf.length + inc.length);
    m.set(buf); m.set(inc, buf.length);
    let start = -1; const pos = [];
    let i = 0;
    while (i < m.length - 3) {
      if (m[i] === 0 && m[i + 1] === 0 && m[i + 2] === 1) { if (start >= 0) pos.push([start, i - start]); start = i; i += 3; }
      else if (m[i] === 0 && m[i + 1] === 0 && m[i + 2] === 0 && m[i + 3] === 1) { if (start >= 0) pos.push([start, i - start]); start = i; i += 4; }
      else i++;
    }
    for (const [p, len] of pos) {
      const nalu = m.subarray(p, p + len);
      let off = 0;
      if (nalu[0] === 0 && nalu[1] === 0 && nalu[2] === 1) off = 3;
      else if (nalu[0] === 0 && nalu[1] === 0 && nalu[2] === 0 && nalu[3] === 1) off = 4;
      const type = nalu.length > off ? nalu[off] & 0x1f : 0;
      s.nal[type] = (s.nal[type] || 0) + 1;
      if (type === 7) {
        const codec = `avc1.${nalu[off + 1].toString(16).padStart(2, "0")}${nalu[off + 2].toString(16).padStart(2, "0")}${nalu[off + 3].toString(16).padStart(2, "0")}`;
        if (!dec && "VideoDecoder" in window) {
          try {
            dec = new VideoDecoder({
              output: (f) => {
                s.out++;
                if (cv.width !== f.displayWidth) { cv.width = f.displayWidth; cv.height = f.displayHeight; log(`[${name}] canvas ${cv.width}x${cv.height}`); }
                cv.getContext("2d").drawImage(f, 0, 0);
                f.close();
              },
              error: (e) => { s.err = "dec: " + e; dec = null; },
            });
            dec.configure({ codec, optimizeForLatency: true, avc: { format: "annexb" } });
            s.configured = codec;
            log(`[${name}] configured ${codec}`);
          } catch (e) { s.err = "cfg: " + e; log(`[${name}] configure 失败 ${codec}: ${e}`); }
        }
      }
      if (dec && dec.state === "closed") dec = null;
      if (!dec || type === 7 || type === 8 || type === 9 || type === 6) continue;
      const data = new Uint8Array(nalu.length - off + 4);
      data.set([0, 0, 0, 1], 0);
      data.set(nalu.subarray(off), 4);
      try { dec.decode(new EncodedVideoChunk({ type: type === 5 ? "key" : "delta", timestamp: performance.now() * 1000, data })); s.decodeOk++; }
      catch (e) { s.decodeErr++; if (s.decodeErr < 3) log(`[${name}] decode err: ${e}`); }
    }
    const last = pos.length ? pos[pos.length - 1][0] : 0;
    buf = m.slice(last);
    if (!s.firstBytes) {
      s.firstBytes = Array.from(inc.subarray(0, Math.min(16, inc.length))).map(b => b.toString(16).padStart(2, "0")).join(" ");
    }
  };
}
probe("harmony", "/api/emulator/harmony/ws");
probe("android", "/api/emulator/android/ws");
setInterval(() => {
  const lines = [];
  for (const [name, s] of Object.entries(stats)) {
    lines.push(`[${name}] msgs=${s.msgs} bytes=${s.bytes} first=${s.firstBytes || "-"} nal=${JSON.stringify(s.nal)} cfg=${s.configured} dec=${s.decodeOk}/${s.decodeErr} out=${s.out} err=${s.err || "-"}`);
  }
  const pre = document.createElement("pre");
  pre.id = "stats";
  pre.textContent = lines.join("\n");
  const old = document.getElementById("stats");
  if (old) old.replaceWith(pre); else document.body.appendChild(pre);
}, 2000);
</script>
</body>
</html>
