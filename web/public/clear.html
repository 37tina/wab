<!doctype html><html lang=zh-CN><meta charset=utf-8><title>清理迁移任务</title>
<body style=font-family:system-ui;padding:32px>
<h2>清理迁移任务</h2>
<p>点击下方按钮清除本地迁移任务（仅清理浏览器 localStorage，不影响已删除的后端 run）。</p>
<button id=btn style=padding:10px 20px;font-size:16px>清除所有非演示任务</button>
<pre id=log style=background:#f5f5f5;padding:12px;white-space:pre-wrap></pre>
<script>
const KEY="tuotaihuangu_projects_v1";
function log(s){document.getElementById('log').textContent+=s+"\n";}
const raw=localStorage.getItem(KEY);
log("当前原始数据长度: "+(raw?raw.length:"null"));
try{
  const arr=JSON.parse(raw||"[]");
  log("任务数: "+arr.length);
  arr.forEach(p=> log(-  |  | workspace: | session: | demo:));
}catch(e){ log("解析失败: "+e.message); }
document.getElementById('btn').onclick=()=>{
  try{
    const arr=JSON.parse(localStorage.getItem(KEY)||"[]");
    const kept=arr.filter(p=> p.demo===true);
    const removed=arr.filter(p=> p.demo!==true);
    localStorage.setItem(KEY, JSON.stringify(kept));
    log("\n已删除 "+removed.length+" 个任务，保留 "+kept.length+" 个演示任务");
    removed.forEach(p=> log(已删:  ));
    log("请返回首页刷新，任务列表将更新。");
  }catch(e){ log("清除失败: "+e.message); }
};
</script>
